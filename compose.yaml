name: home-control

# Keeps container logs from filling the disk of an always-on machine: 5 files x 10 MB per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Secrets (e.g. Home Assistant token) live in .env and reach ONLY the API.
    env_file:
      - path: .env
        required: false
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      DATA_DIR: /data
    # Loopback only: the API is reached through the web app. Opening it to the LAN would expose a second,
    # unfiltered door; set API_BIND_ADDRESS=0.0.0.0 only if you know why you need it.
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-3001}:3001'
    volumes:
      - api-data:/data
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side calls reach the API through the Compose network.
      API_INTERNAL_URL: http://api:3001
    # Reachable from the home network (phones, tablets). Never forward this port on the router; for access
    # away from home use a VPN. Set WEB_BIND_ADDRESS=127.0.0.1 to keep it on this computer only.
    ports:
      - '${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  # Persistent SQLite storage for the API.
  api-data:
